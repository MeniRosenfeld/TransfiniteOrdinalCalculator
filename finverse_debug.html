<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>fInverse Debug Page</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 2em;
        }

        pre {
            background-color: #eee;
            padding: 1em;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <h1>fInverse Debugger</h1>
    <p>This page calculates fInverse for a single hardcoded number using the new architecture.</p>

    <h2>Input Value:</h2>
    <pre id="input-value"></pre>

    <h2>Resulting Ordinal:</h2>
    <pre id="output"></pre>

    <h2>Time Taken:</h2>
    <pre id="time"></pre>

    <h2>Round-trip f:</h2>
    <pre id="f"></pre>

    <!-- Load New Architecture Scripts -->
    <script src="OperationTracer.js"></script>
    <script src="types/OrdinalBase.js"></script>
    <script src="types/FiniteOrdinal.js"></script>
    <script src="types/OmegaOrdinal.js"></script>
    <script src="types/CNFOrdinal.js"></script>
    <script src="types/WTowerOrdinal.js"></script>
    <script src="types/EpsilonZero.js"></script>
    <script src="operations/Rational.js"></script>
    <script src="operations/NumericContexts.js"></script>
    <script src="conversions/ConversionRegistry.js"></script>
    <script src="conversions/ConversionEngine.js"></script>
    <script src="operations/RuleEngine.js"></script>
    <script src="operations/AdditionRules.js"></script>
    <script src="operations/MultiplicationRules.js"></script>
    <script src="operations/ExponentiationRules.js"></script>
    <script src="operations/TetrationRules.js"></script>
    <script src="operations/Comparison.js"></script>
    <script src="operations/Auxiliary.js"></script>
    <script src="operations/Operations.js"></script>
    <script src="SimpleParser.js"></script>
    <script src="ordinal_mapping.js"></script>
    <script src="ordinal_mapping_inverse.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Ensure the new operations system is initialized
            if (window.OPERATIONS) {
                try {
                    OPERATIONS.initialize();
                } catch (e) {
                    console.error("Failed to initialize OPERATIONS:", e);
                    document.getElementById('output').textContent = `Error: ${e.message}`;
                    return;
                }
            }

            // --- CONFIGURATION ---
            const inputValue = 4.921673828647513; // Hardcoded input value (e.g., f(w+1))
            // ---------------------

            document.getElementById('input-value').textContent = inputValue;
            const outputEl = document.getElementById('output');
            const timeEl = document.getElementById('time');
            const fEl = document.getElementById('f');

            try {
                const startTime = performance.now();

                // Use the OLD_F_PARAMS as requested
                const fParams = OLD_F_PARAMS;

                const resultRep = fInverse(inputValue, fParams, 1e-13);
                const ordinalResult = convertFFormatToOrdinalInstance(resultRep);

                const endTime = performance.now();

                outputEl.textContent = ordinalResult.toString();
                timeEl.textContent = `${(endTime - startTime).toFixed(3)} ms`;
                fEl.textContent = (f(resultRep, fParams) - inputValue).toString();

            } catch (e) {
                outputEl.textContent = `Error: ${e.message}`;
                console.error("Error during fInverse calculation:", e);
            }
        });
    </script>
</body>

</html>
