<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New System Smoke Tests</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            margin-bottom: 8px;
        }

        .desc {
            color: #555;
            margin-bottom: 16px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
        }

        th {
            background: #f6f6f6;
            text-align: left;
        }

        .pass {
            color: #0a7d2b;
            font-weight: bold;
        }

        .fail {
            color: #b00020;
            font-weight: bold;
        }

        .controls {
            margin: 12px 0;
        }

        .summary {
            margin-top: 10px;
            font-weight: bold;
        }

        .mono {
            font-family: Consolas, 'Courier New', monospace;
        }
    </style>
</head>

<body>
    <h1>New System Smoke Tests</h1>
    <div class="desc">Quick parser-and-evaluator checks using the new architecture (temporary until we migrate the old
        suite).</div>

    <div class="controls">
        <button id="runBtn">Run Tests</button>
        <span id="summary" class="summary"></span>
    </div>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Input</th>
                <th>Expected</th>
                <th>Actual</th>
                <th>F representation</th>
                <th>f(α)</th>
                <th>f⁻¹(f(α))</th>
                <th>Round-trip</th>
                <th>Status</th>
                <th>Error</th>
            </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
    </table>

    <!-- New Architecture System -->
    <script src="../OperationTracer.js"></script>
    <script src="../types/OrdinalBase.js"></script>
    <script src="../types/FiniteOrdinal.js"></script>
    <script src="../types/OmegaOrdinal.js"></script>
    <script src="../types/CNFOrdinal.js"></script>
    <script src="../types/WTowerOrdinal.js"></script>
    <script src="../types/EpsilonZero.js"></script>
    <script src="../conversions/ConversionRegistry.js"></script>
    <script src="../conversions/ConversionEngine.js"></script>
    <script src="../operations/RuleEngine.js"></script>
    <script src="../operations/AdditionRules.js"></script>
    <script src="../operations/MultiplicationRules.js"></script>
    <script src="../operations/ExponentiationRules.js"></script>
    <script src="../operations/TetrationRules.js"></script>
    <script src="../operations/Comparison.js"></script>
    <script src="../operations/Operations.js"></script>
    <script src="../SimpleParser.js"></script>
    <script src="../ordinal_mapping.js"></script>
    <script src="../ordinal_mapping_inverse.js"></script>

    <script>
        // Ensure the rule-based operations system is initialized before running tests
        (function ensureOpsInit() {
            if (window.OPERATIONS) {
                try { OPERATIONS.initialize(); } catch (e) { console.error(e); }
            }
        })();

        const TEST_CASES = [
            { input: '0', expected: '0' },
            { input: '5', expected: '5' },
            { input: '1+2', expected: '3' },
            { input: '1+w', expected: 'w' },
            { input: 'w+1', expected: 'w+1' },
            { input: '(w+1)*2', expected: 'w*2+1' },
            { input: 'w*w', expected: 'w^2' },
            { input: '2^w', expected: 'w' },
            { input: '(w^w)^w', expected: 'w^w^2' },
            { input: '(w^(w^2))^w', expected: 'w^w^3' },
            { input: 'w^(w+1)', expected: 'w^(w+1)' },
            { input: 'w^^2', expected: 'w^w' },
            { input: 'w^^w', expected: 'e_0' },
            { input: 'e_0', expected: 'e_0' },
        ];

        function stringifyF(obj) {
            try {
                const replacer = (typeof bigIntReplacer === 'function')
                    ? bigIntReplacer
                    : function (key, value) { return (typeof value === 'bigint') ? value.toString() + 'n' : value; };
                return JSON.stringify(obj, replacer);
            } catch (e) {
                return String(obj);
            }
        }

        function runOne(idx, input, expected) {
            const tracer = new OperationTracer(20000);
            const parser = new SimpleParser(input, tracer);
            let actual = '';
            let error = '';
            let fReprStr = '';
            let fValStr = '';
            let invStr = '';
            let rtOk = '';
            try {
                const ord = parser.parse();
                actual = ord.toString();

                // Compute F-representation and f value
                const fRepr = (typeof ord.toFFormat === 'function') ? ord.toFFormat() : null;
                fReprStr = fRepr !== null ? stringifyF(fRepr) : '';
                if (fRepr !== null && typeof f === 'function') {
                    const val = f(fRepr, (typeof DEFAULT_F_PARAMS !== 'undefined') ? DEFAULT_F_PARAMS : undefined);
                    fValStr = (typeof val === 'number' && isFinite(val)) ? val.toPrecision(12).replace(/\.0+$/, '') : String(val);

                    // Round-trip via fInverse
                    if (typeof fInverse === 'function' && typeof convertFFormatToOrdinalInstance === 'function' && typeof OPERATIONS !== 'undefined' && OPERATIONS.initialized) {
                        const invRep = fInverse(val, (typeof DEFAULT_F_PARAMS !== 'undefined') ? DEFAULT_F_PARAMS : undefined);
                        const invOrd = convertFFormatToOrdinalInstance(invRep, new OperationTracer(20000));
                        invStr = (invOrd && typeof invOrd.toString === 'function') ? invOrd.toString() : String(invOrd);
                        try {
                            rtOk = (invOrd.equals && ord.equals) ? (invOrd.equals(ord) && ord.equals(invOrd)) : (OPERATIONS.compare(invOrd, ord) === 0);
                        } catch (cmpErr) {
                            rtOk = false;
                        }
                    }
                }
            } catch (e) {
                error = e && e.message ? e.message : String(e);
            }

            const pass = !error && actual === expected;
            return { idx, input, expected, actual, fReprStr, fValStr, invStr, rtOk, pass, error };
        }

        function renderRow(result) {
            const tr = document.createElement('tr');
            const cells = [
                result.idx + 1,
                `<span class="mono">${result.input}</span>`,
                `<span class="mono">${result.expected}</span>`,
                `<span class="mono">${result.actual}</span>`,
                `<span class="mono">${result.fReprStr}</span>`,
                `<span class="mono">${result.fValStr}</span>`,
                `<span class="mono">${result.invStr}</span>`,
                result.rtOk === '' ? '' : (result.rtOk ? '<span class="pass">OK</span>' : '<span class="fail">Mismatch</span>'),
                result.pass ? '<span class="pass">PASS</span>' : '<span class="fail">FAIL</span>',
                result.error ? `<span class="mono">${result.error}</span>` : ''
            ];
            cells.forEach(html => {
                const td = document.createElement('td');
                td.innerHTML = html;
                tr.appendChild(td);
            });
            return tr;
        }

        function runAll() {
            // Wait until operations are initialized
            if (!window.OPERATIONS || !OPERATIONS.initialized) {
                document.getElementById('summary').textContent = 'Initializing operations...';
                setTimeout(runAll, 150);
                return;
            }
            const tbody = document.getElementById('resultsBody');
            tbody.innerHTML = '';
            let passes = 0;
            const results = TEST_CASES.map((tc, i) => runOne(i, tc.input, tc.expected));
            results.forEach(r => { if (r.pass) passes++; tbody.appendChild(renderRow(r)); });
            document.getElementById('summary').textContent = `${passes}/${TEST_CASES.length} passed`;
        }

        document.getElementById('runBtn').addEventListener('click', runAll);
        // Auto-run on load
        window.addEventListener('DOMContentLoaded', runAll);
    </script>
</body>

</html>
