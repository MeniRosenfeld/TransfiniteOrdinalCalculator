<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Simple Parser Test</title>
</head>

<body>
    <h1>Simple Parser Test</h1>
    <div id="output"></div>

    <!-- Minimal script loading -->
    <script src="../OperationTracer.js"></script>
    <script src="../types/OrdinalBase.js"></script>
    <script src="../types/FiniteOrdinal.js"></script>
    <script src="../types/ZeroOrdinal.js"></script>
    <script src="../types/OneOrdinal.js"></script>
    <script src="../types/OmegaOrdinal.js"></script>
    <script src="../types/CNFOrdinal.js"></script>
    <script src="../types/EpsilonZero.js"></script>
    <script src="../types/EpsilonNumber.js"></script>
    <script src="../SimpleParser.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const output = document.getElementById('output');

            try {
                // Initialize global tracer
                OperationTracer.setGlobalTracer(10000);

                // Test basic parsing
                const tests = [
                    '42',
                    'w',
                    '"hello"',
                    'true',
                    'FALSE',
                    '1 = 1',
                    '!true',
                    'toString[false]'
                ];

                let results = [];

                for (const test of tests) {
                    try {
                        const parser = new SimpleParser(test);
                        const result = parser.parse();
                        let resultStr;

                        if (result && typeof result.toString === 'function' && typeof result.isZero === 'function') {
                            resultStr = result.toString();
                        } else if (result && result.type === 'string') {
                            resultStr = `"${result.value}"`;
                        } else if (result && result.type === 'boolean') {
                            resultStr = result.value.toString();
                        } else {
                            resultStr = String(result);
                        }

                        results.push(`✓ ${test} → ${resultStr}`);
                    } catch (error) {
                        results.push(`✗ ${test} → Error: ${error.message}`);
                    }
                }

                output.innerHTML = '<pre>' + results.join('\n') + '</pre>';
                console.log('Simple parser test completed');

            } catch (error) {
                output.innerHTML = `<pre>Test failed: ${error.message}</pre>`;
                console.error('Test error:', error);
            }
        });
    </script>
</body>

</html>
