<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Debug f() Formula</title>
</head>
<body>
    <h1>Debug f() Formulas</h1>
    <pre id="output"></pre>

    <script type="module">
        import { f, DEFAULT_F_PARAMS, ORDINAL_ZERO, ORDINAL_ONE } from '../src/ordinal_mapping.js';
        import { fTyped } from '../src/ordinal_mapping/OrdinalMapping.js';
        import { DoubleContext } from '../src/ordinal_mapping/Contexts.js';
        import { FParams } from '../src/ordinal_mapping/FParams.js';

        const output = document.getElementById('output');
        
        function log(msg) {
            output.textContent += msg + '\n';
            console.log(msg);
        }

        // Setup
        const doubleCtx = new DoubleContext();
        const newParams = new FParams(
            doubleCtx.fromNumber(3),  // hScale (scaleAdd)
            doubleCtx.fromNumber(3),  // wScale (scaleMult)
            doubleCtx.fromNumber(3),  // eScale (scaleExp)
            doubleCtx.fromNumber(3),  // zScale (scaleEpsilon) - UNUSED in formulas
            doubleCtx.fromNumber(3)   // tScale (scaleTet)
        );

        log('=== Parameter Verification ===');
        log(`DEFAULT_F_PARAMS: scaleAdd=${DEFAULT_F_PARAMS.ctx.toNumber(DEFAULT_F_PARAMS.scaleAdd)}, scaleMult=${DEFAULT_F_PARAMS.ctx.toNumber(DEFAULT_F_PARAMS.scaleMult)}, scaleExp=${DEFAULT_F_PARAMS.ctx.toNumber(DEFAULT_F_PARAMS.scaleExp)}, scaleTet=${DEFAULT_F_PARAMS.ctx.toNumber(DEFAULT_F_PARAMS.scaleTet)}, scaleEpsilon=${DEFAULT_F_PARAMS.ctx.toNumber(DEFAULT_F_PARAMS.scaleEpsilon)}`);
        log(`New FParams: hScale=${newParams.hScale.toNumber()}, wScale=${newParams.wScale.toNumber()}, eScale=${newParams.eScale.toNumber()}, zScale=${newParams.zScale.toNumber()}, tScale=${newParams.tScale.toNumber()}`);
        log('');

        log('=== Precomputed Values ===');
        for (let i = 1; i <= 10; i++) {
            if (DEFAULT_F_PARAMS.precomputed[i]) {
                log(`precomputed[${i}] = ${DEFAULT_F_PARAMS.ctx.toNumber(DEFAULT_F_PARAMS.precomputed[i])}`);
            }
        }
        log('');

        log('=== Test Cases ===');
        
        const testCases = [
            { rep: 0n, name: 'f(0)' },
            { rep: 1n, name: 'f(1)' },
            { rep: 5n, name: 'f(5)' },
            { rep: 10n, name: 'f(10)' },
            { rep: { type: 'pow', k: 0n }, name: 'f(ω^0)' },
            { rep: { type: 'pow', k: 1n }, name: 'f(ω)' },
            { rep: { type: 'pow', k: 2n }, name: 'f(ω^2)' },
            { rep: { type: 'sum', beta: 1n, c: 1, delta: 0n }, name: 'f(ω*1+0)' },
            { rep: { type: 'sum', beta: 1n, c: 1, delta: 1n }, name: 'f(ω+1)' },
            { rep: { type: 'sum', beta: 1n, c: 2, delta: 0n }, name: 'f(ω*2)' },
            { rep: { type: 'pow', k: { type: 'pow', k: 1n } }, name: 'f(ω^ω)' },
            { rep: { type: 'w_tower', height: 1 }, name: 'f(ω↑↑1)' },
            { rep: { type: 'w_tower', height: 2 }, name: 'f(ω↑↑2)' },
            { rep: { type: 'epsilon', index: 0n }, name: 'f(ε_0)' },
            { rep: 'E0_TYPE', name: 'f(E0_TYPE)' },
        ];

        for (const testCase of testCases) {
            try {
                const origResult = f(testCase.rep, DEFAULT_F_PARAMS);
                const newResult = fTyped(testCase.rep, newParams, doubleCtx).toNumber();
                const diff = Math.abs(origResult - newResult);
                const match = diff < 1e-10;
                
                log(`${testCase.name}:`);
                log(`  Original: ${origResult}`);
                log(`  New:      ${newResult}`);
                log(`  Diff:     ${diff.toExponential(3)} ${match ? '✓' : '✗ MISMATCH'}`);
                log('');
            } catch (error) {
                log(`${testCase.name}: ERROR - ${error.message}`);
                log('');
            }
        }

        log('=== Formula Verification ===');
        log('Manual calculation for f(1) with DEFAULT_F_PARAMS (all scales = 3):');
        log('  f(1) = 1 / (1 + scaleAdd) = 1 / (1 + 3) = 1/4 = 0.25');
        log('  Actual f(1) = ' + f(1n, DEFAULT_F_PARAMS));
        log('');

        log('Manual calculation for f(ω) = f(ω^1):');
        log('  j = 1, so f(ω^1) = 1 + scaleMult * (1 + scaleExp) * f(j-1)');
        log('  = 1 + 3 * (1 + 3) * f(0)');
        log('  = 1 + 3 * 4 * 0 = 1');
        log('  Actual f(ω) = ' + f({ type: 'pow', k: 1n }, DEFAULT_F_PARAMS));
        log('');

        log('Manual calculation for f(ω^2):');
        log('  j = 2, so f(ω^2) = 1 + scaleMult * (1 + scaleExp) * f(j-1)');
        log('  = 1 + 3 * (1 + 3) * f(1)');
        log('  = 1 + 3 * 4 * 0.25 = 1 + 12 * 0.25 = 1 + 3 = 4');
        log('  Actual f(ω^2) = ' + f({ type: 'pow', k: 2n }, DEFAULT_F_PARAMS));
        log('');

        log('Manual calculation for f(ε_0):');
        log('  f(ε_0) = precomputed[5] = 1 + (1 + scaleTet) * scaleMult * (1 + scaleExp)');
        log('  = 1 + (1 + 3) * 3 * (1 + 3)');
        log('  = 1 + 4 * 3 * 4 = 1 + 48 = 49');
        log('  Actual f(ε_0) = ' + f({ type: 'epsilon', index: 0n }, DEFAULT_F_PARAMS));
        log('');

        log('Manual calculation for f(ω↑↑1):');
        log('  height = 1, so f(ω↑↑1) = 1 + precomputed[4] * f(height-1)');
        log('  precomputed[4] = (1 + scaleTet) * scaleMult * (1 + scaleExp) = 4 * 3 * 4 = 48');
        log('  f(ω↑↑1) = 1 + 48 * f(0) = 1 + 48 * 0 = 1');
        log('  Actual f(ω↑↑1) = ' + f({ type: 'w_tower', height: 1 }, DEFAULT_F_PARAMS));
    </script>
</body>
</html>
