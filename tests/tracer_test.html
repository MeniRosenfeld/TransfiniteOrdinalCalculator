<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Operation Tracer Test</title>
    <style>
        body {
            font-family: sans-serif;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
        }

        textarea {
            width: 100%;
            height: 180px;
            font-family: monospace;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 15px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 6px 8px;
            text-align: left;
            font-family: monospace;
        }

        th {
            background: #f3f3f3;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin: 10px 0;
        }

        .controls input[type="number"] {
            width: 180px;
        }

        .status {
            margin-top: 8px;
            color: #666;
        }

        .error {
            color: #b00020;
            white-space: pre-wrap;
        }

        .ok {
            color: #0a7f2e;
        }

        .small {
            font-size: 12px;
            color: #555;
        }

        .row-err {
            background: #fff3f3;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Operation Tracer Test</h1>

        <div class="controls">
            <label>Budget:
                <input id="budgetInput" type="number" value="10000000" min="1">
            </label>
            <button id="runBtn">Run</button>
            <button id="copyBtn">Copy Results</button>
        </div>

        <div class="small">Each expression runs with a fresh OperationTracer. We record operation counts after parse,
            convert-to-CNF (if available), simplify(1000), and toString().</div>

        <label for="exprs">Expressions (one per line):</label>
        <textarea id="exprs">0
1
5
w
w+1
w*3
w^2
w^w
(w+1)*(w+2)
2^w
4^(w^7+3)
w^(w+1)
w^w^2
w^^2
w^^3
w^w + w + 1
(w^2+w*3+5)*w + (w+1)
(w^w + w + 1)^2
</textarea>

        <div id="status" class="status"></div>

        <table id="resultsTable">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Expression</th>
                    <th>Parse</th>
                    <th>CNF Δ</th>
                    <th>Simplify Δ</th>
                    <th>toString Δ</th>
                    <th>Total</th>
                    <th>Result</th>
                    <th>Error</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- Load core runtime (same order as test pages) -->
    <script src="../OperationTracer.js"></script>
    <script src="../types/OrdinalBase.js"></script>
    <script src="../types/FiniteOrdinal.js"></script>
    <script src="../types/ZeroOrdinal.js"></script>
    <script src="../types/OneOrdinal.js"></script>
    <script src="../types/OmegaOrdinal.js"></script>
    <script src="../types/CNFOrdinal.js"></script>
    <script src="../types/WTowerOrdinal.js"></script>
    <script src="../types/EpsilonZero.js"></script>
    <script src="../types/EpsilonNumber.js"></script>
    <script src="../conversions/ConversionRegistry.js"></script>
    <script src="../conversions/ConversionEngine.js"></script>
    <script src="../operations/RuleEngine.js"></script>
    <script src="../operations/AdditionRules.js"></script>
    <script src="../operations/MultiplicationRules.js"></script>
    <script src="../operations/ExponentiationRules.js"></script>
    <script src="../operations/TetrationRules.js"></script>
    <script src="../operations/Comparison.js"></script>
    <script src="../operations/Operations.js"></script>
    <script src="../SimpleParser.js"></script>

    <script>
        (function () {
            const budgetInput = document.getElementById('budgetInput');
            const exprs = document.getElementById('exprs');
            const runBtn = document.getElementById('runBtn');
            const copyBtn = document.getElementById('copyBtn');
            const statusDiv = document.getElementById('status');
            const tbody = document.querySelector('#resultsTable tbody');

            function textRow(cols, isErr = false) {
                const tr = document.createElement('tr');
                if (isErr) tr.classList.add('row-err');
                cols.forEach(c => {
                    const td = document.createElement('td');
                    td.textContent = c == null ? '' : String(c);
                    tr.appendChild(td);
                });
                return tr;
            }

            function runAll() {
                tbody.innerHTML = '';
                const lines = exprs.value.split(/\r?\n/).map(l => l.trim());
                const filtered = lines.filter(l => l.length > 0);
                const budget = Math.max(1, Number(budgetInput.value) || 10000000);
                statusDiv.textContent = `Running ${filtered.length} expressions with budget=${budget}...`;

                let idx = 0;
                for (const line of filtered) {
                    idx += 1;
                    const tracer = new OperationTracer(budget);
                    let parseCount = 0, cnfDelta = 0, simpDelta = 0, toStrDelta = 0, total = 0;
                    let resultString = '', err = '';

                    try {
                        // Parse
                        const parser = new SimpleParser(line, tracer);
                        let ord = parser.parse();
                        parseCount = tracer.getCount();

                        // Optional CNF conversion (only if available)
                        const beforeCnf = tracer.getCount();
                        try {
                            if (window.OPERATIONS && OPERATIONS.initialized && ord.isLessThanEpsilon0 && ord.isLessThanEpsilon0() && OPERATIONS.canConvert(ord, 'CNF')) {
                                ord = OPERATIONS.convert(ord, 'CNF');
                            }
                        } catch (e) { /* ignore cnf conversion errors */ }
                        cnfDelta = tracer.getCount() - beforeCnf;

                        // Simplify
                        const beforeSimp = tracer.getCount();
                        try {
                            if (ord && typeof ord.simplify === 'function') {
                                const simp = ord.simplify(1000);
                                if (simp && simp.simplifiedOrdinal) ord = simp.simplifiedOrdinal;
                            }
                        } catch (e) { /* ignore simplify errors */ }
                        simpDelta = tracer.getCount() - beforeSimp;

                        // toString
                        const beforeToStr = tracer.getCount();
                        try { resultString = ord.toString(); } catch (e) { resultString = ''; }
                        toStrDelta = tracer.getCount() - beforeToStr;

                        total = tracer.getCount();
                        tbody.appendChild(textRow([idx, line, parseCount, cnfDelta, simpDelta, toStrDelta, total, resultString, '']));
                    } catch (e) {
                        total = tracer.getCount();
                        err = e && e.message ? e.message : String(e);
                        tbody.appendChild(textRow([idx, line, parseCount, cnfDelta, simpDelta, toStrDelta, total, '', err], true));
                    }
                }
                statusDiv.textContent = `Done. Ran ${filtered.length} expressions.`;
            }

            function copyResults() {
                const rows = Array.from(tbody.querySelectorAll('tr'));
                const lines = rows.map(tr => Array.from(tr.children).map(td => td.textContent).join('\t'));
                const out = ['#\tExpr\tParse\tCNF d\tSimp d\tToStr d\tTotal\tResult\tError'].concat(lines).join('\n');
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(out).then(() => {
                        statusDiv.textContent = 'Results copied to clipboard.';
                    }).catch(() => {
                        prompt('Copy failed. Manual copy:', out);
                    });
                } else {
                    prompt('Copy results:', out);
                }
            }

            runBtn.addEventListener('click', runAll);
            copyBtn.addEventListener('click', copyResults);
        })();
    </script>
</body>

</html>
