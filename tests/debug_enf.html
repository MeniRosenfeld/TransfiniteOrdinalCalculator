<!DOCTYPE html>
<html>

<head>
    <title>ENF Debug Page</title>
    <meta charset="utf-8">
    <style>
        body {
            font-family: monospace;
            margin: 20px;
            line-height: 1.4;
        }

        .result {
            background-color: #f0f0f0;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .debug-section {
            background-color: #fff5f5;
            padding: 10px;
            margin: 5px 0;
            border-left: 3px solid #ff6b6b;
        }

        .code-block {
            background-color: #f8f8f8;
            padding: 10px;
            margin: 10px 0;
            border-radius: 3px;
            border: 1px solid #ddd;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
        }

        button {
            padding: 8px 16px;
            margin: 5px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>

<body>
    <h1>ENF Debug Page</h1>
    <p>This page loads all ordinal types and allows step-by-step debugging of specific calculations.</p>

    <div class="result">
        <h3>Quick Test Area</h3>
        <button onclick="runDebugTest()">Run Debug Test</button>
        <button onclick="clearResults()">Clear Results</button>
        <div id="results"></div>
    </div>

    <div class="debug-section">
        <h3>Available Ordinals (same as ordinal_enf_test.html)</h3>
        <p>All ordinals from the test file are available: enf_zero, enf_one, enf_w, enf_e0, e0_base, e1_base,
            ord_w_times_2, etc.</p>
    </div>

    <!-- Load all ordinal system scripts (complete set) -->
    <script src="../OperationTracer.js"></script>
    <script src="../RenderingComponents.js"></script>
    <script src="../types/OrdinalBase.js"></script>
    <script src="../types/FiniteOrdinal.js"></script>
    <script src="../types/ZeroOrdinal.js"></script>
    <script src="../types/OneOrdinal.js"></script>
    <script src="../types/OmegaOrdinal.js"></script>
    <script src="../types/CNFOrdinal.js"></script>
    <script src="../types/WTowerOrdinal.js"></script>
    <script src="../types/EpsilonTowerOrdinal.js"></script>
    <script src="../types/EpsilonTunnelOrdinal.js"></script>
    <script src="../types/EpsilonZero.js"></script>
    <script src="../types/EpsilonNumber.js"></script>
    <script src="../types/ENFFactor.js"></script>
    <script src="../types/ENFTerm.js"></script>
    <script src="../types/ENFOrdinal.js"></script>
    <script src="../types/ZetaZero.js"></script>
    <script src="../conversions/ConversionRegistry.js"></script>
    <script src="../conversions/ConversionEngine.js"></script>
    <script src="../operations/RuleEngine.js"></script>
    <script src="../operations/AdditionRules.js"></script>
    <script src="../operations/MultiplicationRules.js"></script>
    <script src="../operations/ExponentiationRules.js"></script>
    <script src="../operations/TetrationRules.js"></script>
    <script src="../operations/Auxiliary.js"></script>
    <script src="../operations/Comparison.js"></script>
    <script src="../operations/Operations.js"></script>
    <script src="../operations/Rational.js"></script>
    <script src="../operations/NumericContexts.js"></script>
    <script src="../SimpleParser.js"></script>
    <script src="../SimpleCalculator.js"></script>

    <script>
        // Initialize global tracer
        OperationTracer.setGlobalTracer(1000000); // 1M operations budget
        console.log('[GlobalTracer] Debug ENF initialized with budget:', OperationTracer.getBudget());

        // Initialize OPERATIONS system immediately
        if (typeof OPERATIONS !== 'undefined' && OPERATIONS.initialize) {
            OPERATIONS.initialize();
            console.log('[DebugENF] OPERATIONS system initialized immediately');
        } else {
            console.error('[DebugENF] OPERATIONS not available or missing initialize method');
        }

        // Define all ordinals using global tracer (no tracer parameters)

        const enf_zero = new ENFOrdinal([]);
        const enf_one = new ENFOrdinal([new ENFTerm([], 1n)]);
        const enf_w = ENFOrdinal.fromCNF(new OmegaOrdinal());
        const enf_e0 = new ENFOrdinal([new ENFTerm([new ENFFactor(new EpsilonZero(), enf_one)], 1n)]);
        const e0_base = new EpsilonNumber(ZeroOrdinal.instance());
        const e1_base = new EpsilonNumber(OneOrdinal.instance());
        const w_cnf = OPERATIONS.convert(new OmegaOrdinal(), 'CNF');
        const one_cnf = OPERATIONS.convert(OneOrdinal.instance(), 'CNF');

        // Additional ordinals referenced in tests
        const ord_zero = enf_zero;
        const ord_one = enf_one;
        const ord_five = new ENFOrdinal([new ENFTerm([], 5n)]);
        const ord_w = enf_w;
        const ord_e0 = enf_e0;
        const ord_e0_plus_1 = OPERATIONS.add(enf_e0, enf_one);
        const ord_w_times_2 = OPERATIONS.multiply(enf_w, new FiniteOrdinal(2));
        const ord_w_plus_1 = OPERATIONS.add(enf_w, enf_one);
        const ord_w_squared = OPERATIONS.power(enf_w, new FiniteOrdinal(2));

        const ord_w_w = new ENFOrdinal([new ENFTerm([new ENFFactor(new OmegaOrdinal(), new OmegaOrdinal())], 1n)]);
        const ord_w_w_plus_1 = new ENFOrdinal([new ENFTerm([new ENFFactor(new OmegaOrdinal(), new OmegaOrdinal())], 1n), new ENFTerm([], 1n)]);
        const ord_w_w_times_2 = new ENFOrdinal([new ENFTerm([new ENFFactor(new OmegaOrdinal(), new OmegaOrdinal())], 2n)]);
        const ord_w_w2 = new ENFOrdinal([new ENFTerm([new ENFFactor(new OmegaOrdinal(), new SimpleParser("w^2").parse())], 1n)]);

        const ord_e0_plus_w = new ENFOrdinal([ord_e0.terms[0].clone(), ord_w.terms[0].clone()]);
        const ord_e0_plus_w_w = new ENFOrdinal([ord_e0.terms[0].clone(), ord_w_w.terms[0].clone()]);
        const ord_e0_times_2 = new ENFOrdinal([new ENFTerm([new ENFFactor(e0_base, enf_one)], 2n)]);
        const ord_e0_times_w = new ENFOrdinal([new ENFTerm([new ENFFactor(e0_base, enf_one), new ENFFactor(new OmegaOrdinal(), enf_one)], 1n)]);
        const ord_e0_squared = new ENFOrdinal([new ENFTerm([new ENFFactor(e0_base, new FiniteOrdinal(2))], 1n)]);

        const ord_e1 = new ENFOrdinal([new ENFTerm([new ENFFactor(e1_base, enf_one)], 1n)]);
        const ord_e1_times_2 = new ENFOrdinal([new ENFTerm([new ENFFactor(e1_base, enf_one)], 2n)]);
        const ord_e1_times_w = new ENFOrdinal([new ENFTerm([new ENFFactor(e1_base, enf_one), new ENFFactor(new OmegaOrdinal(), enf_one)], 1n)]);
        const ord_e1_times_e0 = new ENFOrdinal([new ENFTerm([new ENFFactor(e1_base, enf_one), new ENFFactor(e0_base, enf_one)], 1n)]);
        const ord_e2 = new ENFOrdinal([new ENFTerm([new ENFFactor(new EpsilonNumber(new FiniteOrdinal(2)), enf_one)], 1n)]);

        console.log('All ordinals defined successfully');

        function log(message) {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.innerHTML = message;
            results.appendChild(div);
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }

        // Debug test for comparison between e_1^e_0 and e_1^w^w
        function runDebugTest() {
            clearResults();

            try {
                log('<h4>Testing Comparison Bug: e_1^e_0 vs e_1^w^w</h4>');

                // Method 1: Parse both expressions
                log('<h4>Method 1: Parsing expressions:</h4>');
                OperationTracer.reset(100000);
                const value = new SimpleParser("a>0&&a>0/.{a:=0}").parse();
                const e1_e0_parsed = new SimpleParser("e_1^e_0").parse();

                OperationTracer.reset(100000);
                const e1_ww_parsed = new SimpleParser("e_1^w^w").parse();

                log(`<strong>e_1^e_0 (parsed):</strong> ${e1_e0_parsed.toString()}`);
                log(`<strong>Type:</strong> ${e1_e0_parsed.constructor.name}`);
                log(`<strong>e_1^w^w (parsed):</strong> ${e1_ww_parsed.toString()}`);
                log(`<strong>Type:</strong> ${e1_ww_parsed.constructor.name}`);

                // Method 2: Construct manually
                log('<h4>Method 2: Manual construction:</h4>');
                const e1_e0_manual = new ENFOrdinal([new ENFTerm([new ENFFactor(e1_base, e0_base)], 1n)]);
                const e1_ww_manual = new ENFOrdinal([new ENFTerm([new ENFFactor(e1_base, ord_w_w.terms[0])], 1n)]);

                log(`<strong>e_1^e_0 (manual):</strong> ${e1_e0_manual.toString()}`);
                log(`<strong>e_1^w^w (manual):</strong> ${e1_ww_manual.toString()}`);

                // Show detailed structure
                log('<h4>Detailed Structure Analysis:</h4>');

                function showStructure(ordinal, name) {
                    log(`<strong>${name} structure:</strong>`);
                    log(`  Terms count: ${ordinal.terms.length}`);
                    ordinal.terms.forEach((term, i) => {
                        log(`  Term ${i}: ${term.toString()}`);
                        log(`    Factors count: ${term.factors.length}`);
                        term.factors.forEach((factor, j) => {
                            log(`      Factor ${j}: ${factor.base.toString()}^${factor.exponent.toString()}`);
                            log(`      Factor ${j} types: base=${factor.base.constructor.name}, exp=${factor.exponent.constructor.name}`);
                        });
                        log(`    Coefficient: ${term.coefficient}`);
                    });
                }

                showStructure(e1_e0_parsed, "e_1^e_0 (parsed)");
                showStructure(e1_ww_parsed, "e_1^w^w (parsed)");

                // Perform the comparison
                log('<h4>Comparison Results:</h4>');

                OperationTracer.reset(50000);
                const comparison1 = e1_e0_parsed.compareTo(e1_ww_parsed);
                log(`<strong>e_1^e_0 compareTo e_1^w^w:</strong> ${comparison1}`);
                log(`  Interpretation: ${comparison1 < 0 ? 'e_1^e_0 < e_1^w^w' : comparison1 > 0 ? 'e_1^e_0 > e_1^w^w' : 'e_1^e_0 = e_1^w^w'}`);

                OperationTracer.reset(50000);
                const comparison2 = e1_ww_parsed.compareTo(e1_e0_parsed);
                log(`<strong>e_1^w^w compareTo e_1^e_0:</strong> ${comparison2}`);
                log(`  Interpretation: ${comparison2 < 0 ? 'e_1^w^w < e_1^e_0' : comparison2 > 0 ? 'e_1^w^w > e_1^e_0' : 'e_1^w^w = e_1^e_0'}`);

                // Mathematical expectation
                log('<h4>Mathematical Analysis:</h4>');
                log(`<strong>Expected result:</strong> Since ω^ω = ε_0, we should have e_1^e_0 = e_1^(ω^ω)`);
                log(`<strong>Therefore:</strong> e_1^e_0 should equal e_1^w^w (comparison should return 0)`);

                // Test using OPERATIONS.compare directly
                log('<h4>Using OPERATIONS.compare directly:</h4>');
                OperationTracer.reset(50000);
                const directComparison = OPERATIONS.compare(e1_e0_parsed, e1_ww_parsed);
                log(`<strong>OPERATIONS.compare(e_1^e_0, e_1^w^w):</strong> ${directComparison}`);

                // Check if they're equal using equals method
                log('<h4>Equality Check:</h4>');
                const areEqual = e1_e0_parsed.equals(e1_ww_parsed);
                log(`<strong>e_1^e_0.equals(e_1^w^w):</strong> ${areEqual}`);

            } catch (error) {
                log(`<strong style="color: red;">Error:</strong> ${error.message}`);
                log(`<strong style="color: red;">Stack:</strong> ${error.stack}`);
                console.error('Debug test error:', error);
            }
        }

        // Helper functions for interactive debugging
        window.debugCompare = function (a, b) {
            const result = OPERATIONS.compare(a, b);
            log(`Compare ${a.toString()} vs ${b.toString()}: ${result}`);
            return result;
        };

        window.debugTerm = function (term) {
            log(`Term: ${term.toString()}`);
            log(`  Factors: ${term.factors.length}`);
            term.factors.forEach((f, i) => {
                log(`    Factor ${i}: ${f.base.toString()}^${f.exponent.toString()}`);
            });
            log(`  Coefficient: ${term.coefficient}`);
        };

        // Make ordinals available globally for console debugging
        window.ordinals = {
            enf_zero, enf_one, enf_w, enf_e0, e0_base, e1_base,
            ord_zero, ord_one, ord_five, ord_w, ord_e0, ord_e0_plus_1,
            ord_w_times_2, ord_w_plus_1, ord_w_squared, ord_w_w,
            ord_w_w_plus_1, ord_w_w_times_2, ord_w_w2, ord_e0_plus_w,
            ord_e0_plus_w_w, ord_e0_times_2, ord_e0_times_w, ord_e0_squared,
            ord_e1, ord_e1_times_2, ord_e1_times_w, ord_e1_times_e0, ord_e2
        };

        console.log('Debug page ready! Use runDebugTest() or access ordinals via window.ordinals');
        console.log('Helper functions: debugCompare(a, b), debugTerm(term)');
    </script>
</body>

</html>
