<!DOCTYPE html>
<html>
<head>
    <title>ENF Debug Page</title>
    <meta charset="utf-8">
    <style>
        body {
            font-family: monospace;
            margin: 20px;
            line-height: 1.4;
        }
        .result {
            background-color: #f0f0f0;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .debug-section {
            background-color: #fff5f5;
            padding: 10px;
            margin: 5px 0;
            border-left: 3px solid #ff6b6b;
        }
        .code-block {
            background-color: #f8f8f8;
            padding: 10px;
            margin: 10px 0;
            border-radius: 3px;
            border: 1px solid #ddd;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
        }
        button {
            padding: 8px 16px;
            margin: 5px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>ENF Debug Page</h1>
    <p>This page loads all ordinal types and allows step-by-step debugging of specific calculations.</p>
    
    <div class="result">
        <h3>Quick Test Area</h3>
        <button onclick="runDebugTest()">Run Debug Test</button>
        <button onclick="clearResults()">Clear Results</button>
        <div id="results"></div>
    </div>

    <div class="debug-section">
        <h3>Available Ordinals (same as ordinal_enf_test.html)</h3>
        <p>All ordinals from the test file are available: enf_zero, enf_one, enf_w, enf_e0, e0_base, e1_base, ord_w_times_2, etc.</p>
    </div>

    <!-- Load all required scripts (same as ordinal_enf_test.html) -->
    <script src="../OperationTracer.js"></script>
    <script src="../types/OrdinalBase.js"></script>
    <script src="../types/FiniteOrdinal.js"></script>
    <script src="../types/ZeroOrdinal.js"></script>
    <script src="../types/OneOrdinal.js"></script>
    <script src="../types/OmegaOrdinal.js"></script>
    <script src="../types/CNFOrdinal.js"></script>
    <script src="../types/WTowerOrdinal.js"></script>
    <script src="../types/EpsilonZero.js"></script>
    <script src="../types/EpsilonNumber.js"></script>
    <script src="../types/ZetaZero.js"></script>
    <script src="../types/ENFFactor.js"></script>
    <script src="../types/ENFTerm.js"></script>
    <script src="../types/ENFOrdinal.js"></script>
    <script src="../conversions/ConversionRegistry.js"></script>
    <script src="../conversions/ConversionEngine.js"></script>
    <script src="../operations/RuleEngine.js"></script>
    <script src="../operations/AdditionRules.js"></script>
    <script src="../operations/MultiplicationRules.js"></script>
    <script src="../operations/ExponentiationRules.js"></script>
    <script src="../operations/TetrationRules.js"></script>
    <script src="../operations/Comparison.js"></script>
    <script src="../operations/Operations.js"></script>
    <script src="../SimpleParser.js"></script>

    <script>
        // Initialize the operations system
        (function () {
            if (window.OPERATIONS) {
                try { 
                    OPERATIONS.initialize(); 
                    console.log('OPERATIONS initialized successfully');
                } catch (e) { 
                    console.error('Failed to initialize OPERATIONS', e); 
                }
            }
        })();

        // Define all ordinals (copied from ordinal_enf_test.html defineTests function)
        const tracer = new OperationTracer(200000);

        const enf_zero = new ENFOrdinal([], tracer);
        const enf_one = new ENFOrdinal([new ENFTerm([], 1n, tracer)]);
        const enf_w = ENFOrdinal.fromCNF(new OmegaOrdinal(tracer));
        const enf_e0 = new ENFOrdinal([new ENFTerm([new ENFFactor(new EpsilonZero(tracer), enf_one)], 1n, tracer)]);
        const e0_base = new EpsilonNumber(new ZeroOrdinal(tracer));
        const e1_base = new EpsilonNumber(new OneOrdinal(tracer));
        const w_cnf = OPERATIONS.convert(new OmegaOrdinal(tracer), 'CNF');
        const one_cnf = OPERATIONS.convert(new OneOrdinal(tracer), 'CNF');

        // Additional ordinals referenced in tests
        const ord_zero = enf_zero;
        const ord_one = enf_one;
        const ord_five = new ENFOrdinal([new ENFTerm([], 5n, tracer)]);
        const ord_w = enf_w;
        const ord_e0 = enf_e0;
        const ord_e0_plus_1 = OPERATIONS.add(enf_e0, enf_one);
        const ord_w_times_2 = OPERATIONS.multiply(enf_w, new FiniteOrdinal(2, tracer));
        const ord_w_plus_1 = OPERATIONS.add(enf_w, enf_one);
        const ord_w_squared = OPERATIONS.power(enf_w, new FiniteOrdinal(2, tracer));

        const ord_w_w = new ENFOrdinal([new ENFTerm([new ENFFactor(new OmegaOrdinal(tracer), new OmegaOrdinal(tracer))], 1n, tracer)]);
        const ord_w_w_plus_1 = new ENFOrdinal([new ENFTerm([new ENFFactor(new OmegaOrdinal(tracer), new OmegaOrdinal(tracer))], 1n, tracer), new ENFTerm([], 1n, tracer)]);
        const ord_w_w_times_2 = new ENFOrdinal([new ENFTerm([new ENFFactor(new OmegaOrdinal(tracer), new OmegaOrdinal(tracer))], 2n, tracer)]);
        const ord_w_w2 = new ENFOrdinal([new ENFTerm([new ENFFactor(new OmegaOrdinal(tracer), new SimpleParser("w^2", tracer).parse())], 1n, tracer)]);

        const ord_e0_plus_w = new ENFOrdinal([ord_e0.terms[0].clone(), ord_w.terms[0].clone()]);
        const ord_e0_plus_w_w = new ENFOrdinal([ord_e0.terms[0].clone(), ord_w_w.terms[0].clone()]);
        const ord_e0_times_2 = new ENFOrdinal([new ENFTerm([new ENFFactor(e0_base, enf_one)], 2n, tracer)]);
        const ord_e0_times_w = new ENFOrdinal([new ENFTerm([new ENFFactor(e0_base, enf_one), new ENFFactor(new OmegaOrdinal(tracer), enf_one)], 1n, tracer)]);
        const ord_e0_squared = new ENFOrdinal([new ENFTerm([new ENFFactor(e0_base, new FiniteOrdinal(2, tracer))], 1n, tracer)]);

        const ord_e1 = new ENFOrdinal([new ENFTerm([new ENFFactor(e1_base, enf_one)], 1n, tracer)]);
        const ord_e1_times_2 = new ENFOrdinal([new ENFTerm([new ENFFactor(e1_base, enf_one)], 2n, tracer)]);
        const ord_e1_times_w = new ENFOrdinal([new ENFTerm([new ENFFactor(e1_base, enf_one), new ENFFactor(new OmegaOrdinal(tracer), enf_one)], 1n, tracer)]);
        const ord_e1_times_e0 = new ENFOrdinal([new ENFTerm([new ENFFactor(e1_base, enf_one), new ENFFactor(e0_base, enf_one)], 1n, tracer)]);
        const ord_e2 = new ENFOrdinal([new ENFTerm([new ENFFactor(new EpsilonNumber(new FiniteOrdinal(2, tracer), tracer), enf_one)], 1n, tracer)]);

        console.log('All ordinals defined successfully');

        function log(message) {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.innerHTML = message;
            results.appendChild(div);
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }

        // Example debug test - modify this function to test whatever you want
        function runDebugTest() {
            clearResults();
            
            try {
                log('<h4>Testing ENF Exponentiation: ω^ω (matching ordinal_enf_test.html)</h4>');
                
                // Method 1: Pre-constructed ω^ω (as done in Complex Comparison section)
                log('<h4>Method 1: Pre-constructed ω^ω (from Complex Comparison):</h4>');
                const ord_w_w = new ENFOrdinal([new ENFTerm([new ENFFactor(new OmegaOrdinal(tracer), new OmegaOrdinal(tracer))], 1n, tracer)]);
                log(`<strong>Pre-constructed ω^ω:</strong> ${ord_w_w.toString()}`);
                log(`<strong>Type:</strong> ${ord_w_w.constructor.name}`);
                
                // Show its structure
                log(`<strong>Terms count:</strong> ${ord_w_w.terms.length}`);
                ord_w_w.terms.forEach((term, i) => {
                    log(`<strong>Term ${i}:</strong> ${term.toString()}`);
                    log(`  Factors: ${term.factors.length}`);
                    term.factors.forEach((factor, j) => {
                        log(`    Factor ${j}: base=${factor.base.toString()}, exp=${factor.exponent.toString()}`);
                        log(`    Factor ${j} types: base=${factor.base.constructor.name}, exp=${factor.exponent.constructor.name}`);
                    });
                    log(`  Coefficient: ${term.coefficient}`);
                });
                
                // Method 2: Computed ω^ω using power method
                log('<h4>Method 2: Computed ω^ω using .power() method:</h4>');
                const omega1 = new OmegaOrdinal(tracer);
                const omega2 = new OmegaOrdinal(tracer);
                
                log(`<strong>Base (ω):</strong> ${omega1.toString()}`);
                log(`<strong>Exponent (ω):</strong> ${omega2.toString()}`);
                
                const computedResult = omega1.power(omega2);
                log(`<strong>Computed ω^ω:</strong> ${computedResult.toString()}`);
                log(`<strong>Type:</strong> ${computedResult.constructor.name}`);
                
                // Show its structure if ENF
                if (computedResult instanceof ENFOrdinal) {
                    log(`<strong>Terms count:</strong> ${computedResult.terms.length}`);
                    computedResult.terms.forEach((term, i) => {
                        log(`<strong>Term ${i}:</strong> ${term.toString()}`);
                        log(`  Factors: ${term.factors.length}`);
                        term.factors.forEach((factor, j) => {
                            log(`    Factor ${j}: base=${factor.base.toString()}, exp=${factor.exponent.toString()}`);
                            log(`    Factor ${j} types: base=${factor.base.constructor.name}, exp=${factor.exponent.constructor.name}`);
                        });
                        log(`  Coefficient: ${term.coefficient}`);
                    });
                }
                
                // Method 3: Using OPERATIONS.power directly
                log('<h4>Method 3: Using OPERATIONS.power() directly:</h4>');
                const directResult = OPERATIONS.power(omega1, omega2);
                log(`<strong>OPERATIONS.power(ω, ω):</strong> ${directResult.toString()}`);
                log(`<strong>Type:</strong> ${directResult.constructor.name}`);
                
                // Compare all three approaches
                log('<h4>Comparisons:</h4>');
                log(`<strong>Pre-constructed vs Computed:</strong> ${ord_w_w.compareTo(computedResult)} (should be 0 if equal)`);
                log(`<strong>Pre-constructed vs Direct:</strong> ${ord_w_w.compareTo(directResult)} (should be 0 if equal)`);
                log(`<strong>Computed vs Direct:</strong> ${computedResult.compareTo(directResult)} (should be 0 if equal)`);
                
                // Compare with ε_0
                log('<h4>Comparison with ε_0:</h4>');
                const epsilon0 = new EpsilonZero(tracer);
                const epsilon0ENF = OPERATIONS.convert(epsilon0, 'ENF');
                
                log(`<strong>ε_0:</strong> ${epsilon0ENF.toString()}`);
                log(`<strong>Pre-constructed ω^ω vs ε_0:</strong> ${ord_w_w.compareTo(epsilon0ENF)} (should be 0 if equal)`);
                log(`<strong>Computed ω^ω vs ε_0:</strong> ${computedResult.compareTo(epsilon0ENF)} (should be 0 if equal)`);
                log(`<strong>Direct ω^ω vs ε_0:</strong> ${directResult.compareTo(epsilon0ENF)} (should be 0 if equal)`);
                
            } catch (error) {
                log(`<strong style="color: red;">Error:</strong> ${error.message}`);
                log(`<strong style="color: red;">Stack:</strong> ${error.stack}`);
                console.error('Debug test error:', error);
            }
        }

        // Helper functions for interactive debugging
        window.debugCompare = function(a, b) {
            const result = OPERATIONS.compare(a, b);
            log(`Compare ${a.toString()} vs ${b.toString()}: ${result}`);
            return result;
        };

        window.debugTerm = function(term) {
            log(`Term: ${term.toString()}`);
            log(`  Factors: ${term.factors.length}`);
            term.factors.forEach((f, i) => {
                log(`    Factor ${i}: ${f.base.toString()}^${f.exponent.toString()}`);
            });
            log(`  Coefficient: ${term.coefficient}`);
        };

        // Make ordinals available globally for console debugging
        window.ordinals = {
            enf_zero, enf_one, enf_w, enf_e0, e0_base, e1_base,
            ord_zero, ord_one, ord_five, ord_w, ord_e0, ord_e0_plus_1,
            ord_w_times_2, ord_w_plus_1, ord_w_squared, ord_w_w,
            ord_w_w_plus_1, ord_w_w_times_2, ord_w_w2, ord_e0_plus_w,
            ord_e0_plus_w_w, ord_e0_times_2, ord_e0_times_w, ord_e0_squared,
            ord_e1, ord_e1_times_2, ord_e1_times_w, ord_e1_times_e0, ord_e2
        };

        console.log('Debug page ready! Use runDebugTest() or access ordinals via window.ordinals');
        console.log('Helper functions: debugCompare(a, b), debugTerm(term)');
    </script>
</body>
</html>
