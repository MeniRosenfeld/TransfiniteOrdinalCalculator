<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Tracer Test</title>
</head>
<body>
    <h1>Global Tracer Architecture Test</h1>
    <div id="results"></div>

    <script src="../OperationTracer.js"></script>
    
    <script>
        function runGlobalTracerTest() {
            const results = document.getElementById('results');
            
            try {
                // Test 1: Initialize global tracer
                OperationTracer.setGlobalTracer(100);
                console.log('✅ Global tracer initialized');
                results.innerHTML += '<p>✅ Global tracer initialized with budget 100</p>';
                
                // Test 2: Consume operations
                OperationTracer.consume(10);
                console.log('✅ Consumed 10 operations, remaining:', 100 - OperationTracer.getCount());
                results.innerHTML += `<p>✅ Consumed 10 operations, count: ${OperationTracer.getCount()}</p>`;
                
                // Test 3: Check budget tracking
                const count = OperationTracer.getCount();
                const budget = OperationTracer.getBudget();
                results.innerHTML += `<p>📊 Current count: ${count}, Budget: ${budget}</p>`;
                
                // Test 4: Reset tracer
                OperationTracer.reset(200);
                console.log('✅ Reset tracer with budget 200');
                results.innerHTML += `<p>✅ Reset tracer, new count: ${OperationTracer.getCount()}, new budget: ${OperationTracer.getBudget()}</p>`;
                
                // Test 5: Try to exceed budget
                try {
                    OperationTracer.consume(250);
                    results.innerHTML += '<p>❌ Should have thrown budget exceeded error</p>';
                } catch (error) {
                    console.log('✅ Budget exceeded error caught:', error.message);
                    results.innerHTML += `<p>✅ Budget exceeded error: ${error.message}</p>`;
                }
                
                results.innerHTML += '<p><strong>🎯 Global tracer architecture working correctly!</strong></p>';
                
            } catch (error) {
                console.error('❌ Global tracer test failed:', error);
                results.innerHTML += `<p>❌ Test failed: ${error.message}</p>`;
            }
        }
        
        // Run test when page loads
        window.addEventListener('load', runGlobalTracerTest);
    </script>
</body>
</html>
