<!DOCTYPE html>
<html>
<head>
    <title>Focused f() Debug Test</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .pass { color: green; }
        .fail { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Focused f() Debug Test</h1>
    <div id="output"></div>

    <script type="module">
        import { f, DEFAULT_F_PARAMS } from '../src/ordinal_mapping.js';
        import { fTyped } from '../src/ordinal_mapping/OrdinalMapping.js';
        import { DoubleContext } from '../src/ordinal_mapping/Contexts.js';
        import { FParams } from '../src/ordinal_mapping/FParams.js';

        const output = document.getElementById('output');
        
        function log(msg, isError = false) {
            const div = document.createElement('div');
            div.textContent = msg;
            if (isError) div.className = 'fail';
            output.appendChild(div);
        }

        const doubleCtx = new DoubleContext();
        const newParams = new FParams(
            doubleCtx.fromNumber(3),  // hScale
            doubleCtx.fromNumber(3),  // wScale
            doubleCtx.fromNumber(3),  // eScale
            doubleCtx.fromNumber(3),  // zScale
            doubleCtx.fromNumber(3)   // tScale
        );

        log('Testing with DEFAULT_F_PARAMS (all scales = 3)');
        log('');

        // Test f(0)
        const f0_orig = f(0n, DEFAULT_F_PARAMS);
        const f0_new = fTyped(0n, newParams, doubleCtx).toNumber();
        log(`f(0): orig=${f0_orig}, new=${f0_new}, match=${f0_orig === f0_new ? '✓' : '✗'}`, f0_orig !== f0_new);
        
        // Test f(1)
        const f1_orig = f(1n, DEFAULT_F_PARAMS);
        const f1_new = fTyped(1n, newParams, doubleCtx).toNumber();
        log(`f(1): orig=${f1_orig}, new=${f1_new}, match=${Math.abs(f1_orig - f1_new) < 1e-10 ? '✓' : '✗'}`, Math.abs(f1_orig - f1_new) >= 1e-10);
        
        // Test f(5)
        const f5_orig = f(5n, DEFAULT_F_PARAMS);
        const f5_new = fTyped(5n, newParams, doubleCtx).toNumber();
        log(`f(5): orig=${f5_orig}, new=${f5_new}, match=${Math.abs(f5_orig - f5_new) < 1e-10 ? '✓' : '✗'}`, Math.abs(f5_orig - f5_new) >= 1e-10);
        
        // Test f(ω)
        const fOmega_orig = f({ type: 'pow', k: 1n }, DEFAULT_F_PARAMS);
        const fOmega_new = fTyped({ type: 'pow', k: 1n }, newParams, doubleCtx).toNumber();
        log(`f(ω): orig=${fOmega_orig}, new=${fOmega_new}, match=${Math.abs(fOmega_orig - fOmega_new) < 1e-10 ? '✓' : '✗'}`, Math.abs(fOmega_orig - fOmega_new) >= 1e-10);
        
        // Test f(ω^2)
        const fOmega2_orig = f({ type: 'pow', k: 2n }, DEFAULT_F_PARAMS);
        const fOmega2_new = fTyped({ type: 'pow', k: 2n }, newParams, doubleCtx).toNumber();
        log(`f(ω^2): orig=${fOmega2_orig}, new=${fOmega2_new}, match=${Math.abs(fOmega2_orig - fOmega2_new) < 1e-10 ? '✓' : '✗'}`, Math.abs(fOmega2_orig - fOmega2_new) >= 1e-10);
        
        // Test f(ε_0)
        const fEps_orig = f({ type: 'epsilon', index: 0n }, DEFAULT_F_PARAMS);
        const fEps_new = fTyped({ type: 'epsilon', index: 0n }, newParams, doubleCtx).toNumber();
        log(`f(ε_0): orig=${fEps_orig}, new=${fEps_new}, match=${Math.abs(fEps_orig - fEps_new) < 1e-10 ? '✓' : '✗'}`, Math.abs(fEps_orig - fEps_new) >= 1e-10);
        
        log('');
        log('If all tests show ✓, the implementation is correct!');
        log('If any show ✗, that indicates a formula mismatch.');
    </script>
</body>
</html>
